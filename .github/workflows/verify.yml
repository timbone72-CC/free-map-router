name: Verify Contract and App

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run complete regression suite
        run: npm test

      - name: Check first-party JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            node --check "$file"
          done

      - name: Package isolated browser preview
        uses: actions/upload-artifact@v4
        with:
          name: phase-2g-browser-preview
          path: .
          retention-days: 1

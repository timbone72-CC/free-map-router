name: Verify Contract and App

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run complete regression suite
        run: npm test

      - name: Check first-party JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            node --check "$file"
          done

      - name: Install isolated browser smoke dependency
        run: python3 -m pip install --disable-pip-version-check selenium==4.32.0

      - name: Run isolated Phase 2G service-time browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/fmr-phase2g-service-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python3 tests/phase2g_service_time_browser_smoke.py

      - name: Upload service-time browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-2g-service-time-browser-smoke-evidence
          path: phase2g-service-time-browser-smoke.json
          if-no-files-found: ignore
          retention-days: 1

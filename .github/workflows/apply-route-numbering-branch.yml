name: Apply Route Numbering Branch Patch

on:
  push:
    branches:
      - feature/numbered-route-stops

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact governed patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("app.js")
          app = app_path.read_text()

          anchor = r'''function formatJobLine(job) {
              const label = job.label ? `${job.label} — ` : "";
              const addr = job.address || "";
              const notesRaw = String(job.notes || "").trim();
              const notes = notesRaw ? ` | Notes: ${notesRaw}` : "";
              return `${label}${addr}${notes}`;
          }
          '''

          helpers = r'''
          function routeDisplaySource(job) {
              const searchable = [job?.label, job?.notes]
                  .filter(Boolean)
                  .join(" ")
                  .toUpperCase();

              if (/\bDCFS\b/.test(searchable)) return "DCFS";
              if (/\bGIS\b/.test(searchable)) return "GIS";
              return "";
          }

          function formatRouteStopLine(job, index) {
              const stopNumber = String(index + 1).padStart(2, "0");
              const source = routeDisplaySource(job);
              const address = String(job?.address || "").trim();
              return [stopNumber, source, address].filter(Boolean).join(" — ");
          }
          '''

          if app.count(anchor) != 1:
              raise SystemExit("Expected one formatJobLine anchor; refusing to patch.")
          app = app.replace(anchor, anchor + helpers, 1)

          needle = "            label.textContent = formatJobLine(job);"
          first = app.find(needle)
          second = app.find(needle, first + 1)
          third = app.find(needle, second + 1)
          if first < 0 or second < 0 or third >= 0:
              raise SystemExit("Expected exactly two formatJobLine render calls; refusing to patch.")
          replacement = "            label.textContent = formatRouteStopLine(job, i);"
          app = app[:second] + replacement + app[second + len(needle):]
          app_path.write_text(app)

          contract_path = Path("CONTRACT.md")
          contract = contract_path.read_text()
          contract_anchor = '''12. A round trip that exceeds one safe Google Maps link is divided into
              numbered map sections. The sections preserve the optimized order, connect
              end-to-start without gaps, include every selected stop once, and finish at
              Home.
          '''
          contract_addition = '''13. Build Route displays selected job stops with two-digit numbers matching
              the current route order. Home remains unnumbered at Start and Finish.
          14. Build Route labels and Garmin point names may show `DCFS` or `GIS` when
              that source exists in the saved label or notes. They never insert `MCS`;
              when neither approved source is present, they show the number and address.
          '''
          if contract.count(contract_anchor) != 1:
              raise SystemExit("Expected one route-contract anchor; refusing to patch.")
          contract = contract.replace(
              contract_anchor,
              contract_anchor + contract_addition,
              1,
          )
          contract_path.write_text(contract)

          test_path = Path("tests/route-numbering.test.js")
          if test_path.exists():
              raise SystemExit("Focused test already exists; refusing to overwrite.")
          test_path.write_text(r'''const test = require("node:test");
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const vm = require("node:vm");

          const root = path.resolve(__dirname, "..");
          const app = fs.readFileSync(path.join(root, "app.js"), "utf8");
          const {
              routePointName,
              routeSource,
          } = require("../garmin-gpx.js");

          function appRouteFormatters() {
              const match = app.match(
                  /function routeDisplaySource\(job\) \{[\s\S]*?\n\}\n\nfunction formatRouteStopLine\(job, index\) \{[\s\S]*?\n\}/,
              );
              assert.ok(match, "Route display helpers must remain in app.js");

              const context = {};
              vm.runInNewContext(
                  `${match[0]}\nthis.helpers = { routeDisplaySource, formatRouteStopLine };`,
                  context,
              );
              return context.helpers;
          }

          test("Build Route numbers stops and shows only DCFS or GIS", () => {
              const { formatRouteStopLine } = appRouteFormatters();

              assert.equal(
                  formatRouteStopLine(
                      {
                          address: "123 Main St",
                          label: "Guardian DCFS",
                          notes: "MCS details remain saved",
                      },
                      0,
                  ),
                  "01 — DCFS — 123 Main St",
              );
              assert.equal(
                  formatRouteStopLine(
                      {
                          address: "456 Oak Ave",
                          label: "MCS",
                          notes: "GIS inspection",
                      },
                      1,
                  ),
                  "02 — GIS — 456 Oak Ave",
              );
              assert.equal(
                  formatRouteStopLine(
                      {
                          address: "789 Elm Rd",
                          label: "MCS",
                          notes: "ordinary field notes",
                      },
                      2,
                  ),
                  "03 — 789 Elm Rd",
              );
          });

          test("Address list keeps its existing detailed formatter", () => {
              assert.equal(
                  (app.match(/label\.textContent = formatJobLine\(job\);/g) || [])
                      .length,
                  1,
              );
              assert.equal(
                  (
                      app.match(
                          /label\.textContent = formatRouteStopLine\(job, i\);/g,
                      ) || []
                  ).length,
                  1,
              );
          });

          test("Garmin stop names follow the same source and numbering rules", () => {
              assert.equal(
                  routeSource({ label: "MCS", notes: "DCFS assignment" }),
                  "DCFS",
              );
              assert.equal(
                  routeSource({ label: "MCS", notes: "GIS assignment" }),
                  "GIS",
              );
              assert.equal(
                  routeSource({ label: "MCS", notes: "field notes" }),
                  "",
              );

              assert.equal(
                  routePointName(
                      {
                          address: "123 Main St",
                          label: "MCS",
                          notes: "DCFS assignment",
                      },
                      1,
                      4,
                  ),
                  "01 - DCFS - 123 Main St",
              );
              assert.equal(
                  routePointName(
                      {
                          address: "456 Oak Ave",
                          label: "MCS",
                          notes: "field notes",
                      },
                      2,
                      4,
                  ),
                  "02 - 456 Oak Ave",
              );
              assert.equal(routePointName({}, 0, 4), "Start - Home");
              assert.equal(routePointName({}, 3, 4), "Finish - Home");
          });

          test("route numbering uses the owned render and no observer", () => {
              assert.doesNotMatch(app, /\bMutationObserver\b/);
              assert.match(
                  app,
                  /function renderRouteList\(\)[\s\S]*formatRouteStopLine\(job, i\)/,
              );
          });
          ''')

          Path(".github/workflows/apply-route-numbering-branch.yml").unlink()
          PY

      - name: Run complete verification before commit
        shell: bash
        run: |
          set -euo pipefail
          npm test
          for file in *.js; do
            node --check "$file"
          done

      - name: Commit governed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js CONTRACT.md tests/route-numbering.test.js .github/workflows/apply-route-numbering-branch.yml
          git commit -m "Add safe numbered route stop display"
          git push origin HEAD:feature/numbered-route-stops

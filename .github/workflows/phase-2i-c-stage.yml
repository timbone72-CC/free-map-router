name: Stage Phase 2I-C exact package

on:
  push:
    branches:
      - feat/phase-2i-c-stage-runner-final
    paths:
      - .github/workflows/phase-2i-c-stage.yml

permissions:
  contents: write
  issues: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase-2i-c-stage-runner-final

      - name: Reconstruct exact Phase 2I-C package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/95" > /tmp/phase2ic-issue.json
          gh api "repos/${GITHUB_REPOSITORY}/issues/95/comments?per_page=100" > /tmp/phase2ic-comments.json
          python - <<'PY'
          import hashlib, json
          issue = json.load(open('/tmp/phase2ic-issue.json'))
          comments = json.load(open('/tmp/phase2ic-comments.json'))
          expected_hashes = {
              'PHASE2IC-SMALL-00': '1a74ddba15a323ab7e4db0ab2a51a430e77960012635612eb706f7ebddad96e4',
              'PHASE2IC-SMALL-01': 'fa362abbe071e72d683fed25ac848388fc35c482edbd959157b997d536c4f51a',
              'PHASE2IC-SMALL-02': 'cb6f4e14b1998059af5a1ca42915b22c7bf50e9b2a611762ee09e8b534c90f48',
              'PHASE2IC-SMALL-03': '8b58dfd48b58594ab3adaaa10de6ab7ee975d7e2c545d8bba954b3f4b4d1b19d',
              'PHASE2IC-SMALL-04': 'c854304da7c7c2a1dd3e923d0553300b39ce63cb26758c25c034f158dcaded96',
              'PHASE2IC-SMALL-05': '2dbf418e940a9fb817d640e4ff4366c5082701ec0bf97d6f0a42bf5af9c02547',
              'PHASE2IC-SMALL-06': 'ee2a3d3d40da961ae793b00492ed76977990e6aa658c08f8634e3b307786f2b3',
              'PHASE2IC-SMALL-07': '2a55957e5f7bdfbb8d76d37e453e11ba424fb12f29c3133bf2e9ec8d8e2f511e',
              'PHASE2IC-SMALL-08': '23378b6949fdebf715b62f6a8f5b7f00040570302574d2f88736e02b98abe337',
              'PHASE2IC-SMALL-09': '595c9f28ebb198c9321f0e439857944c1abcb71476dddcdf48d9df95df5199aa',
              'PHASE2IC-SMALL-10': 'a0239d6fd7e59222c38fe1a8cb49fa370f99c2d7bb766617becce91a0290ec3d',
              'PHASE2IC-SMALL-11': 'd5571a0239cb88a2e84cd074ac28f5a1f7c3bc9f301f5ab1f2ef005b5bae9685',
              'PHASE2IC-SMALL-12': 'e9c08a08056e5d8f05d924958b54c4c3326543bb7fcf4fe585196c98cf089733',
              'PHASE2IC-SMALL-13': '336b18df9cecb70f0d2b345fa3dfec83e8e1c082ff7b5bc0b73c4e300e79a295',
              'PHASE2IC-SMALL-14': '2cce2ceb78d8043d538baaf5489317476ac4c27d3dca614c220bea50b41cd11f',
              'PHASE2IC-SMALL-15': 'daf0137fdf04fef87465072f6707857006a213efd32cf865c65b16c7b501bc10',
          }
          parts = []
          for body in [issue.get('body', '')] + [c.get('body', '') for c in comments]:
              if not body.startswith('PHASE2IC-SMALL-'):
                  continue
              marker, data = body.split('\n', 1)
              data = data.strip()
              digest = hashlib.sha256(data.encode()).hexdigest()
              print(f'{marker}: bytes={len(data)} sha256={digest}')
              expected = expected_hashes.get(marker)
              if expected != digest:
                  raise SystemExit(f'{marker} staging hash mismatch: expected {expected}, got {digest}')
              parts.append((marker, data))
          parts.sort()
          expected_markers = [f'PHASE2IC-SMALL-{i:02d}' for i in range(16)]
          actual = [marker for marker, _ in parts]
          if actual != expected_markers:
              raise SystemExit(f'Package markers mismatch: {actual!r}')
          open('/tmp/phase2ic.b64', 'w').write(''.join(data for _, data in parts))
          PY
          base64 -d /tmp/phase2ic.b64 > /tmp/phase2ic.tar.gz
          echo "19d9ef74eaf35d3b8facf298b4101f43d033e8c1848c19cc919dbe593b6a9007  /tmp/phase2ic.tar.gz" | sha256sum -c -
          tar -xzf /tmp/phase2ic.tar.gz -C .
          test -f route-plan-days.js
          test -f route-plan-controls.js
          test -f index.html
          test -f tests/phase-2i-c-day-management.test.js
          test -f docs/PHASE_2I_C_DAY_MANAGEMENT_CHANGE_RECORD_2026-09-08.md
          test -f CONTRACT.md
          test -f REGRESSION_CHECKLIST.md

      - name: Focused Phase 2I-C tests
        run: node --test tests/phase-2i-c-day-management.test.js

      - name: Complete regression suite
        run: npm test

      - name: First-party JavaScript syntax
        run: |
          set -euo pipefail
          for file in *.js; do node --check "$file"; done

      - name: Commit exact tested Phase 2I-C tree
        run: |
          set -euo pipefail
          rm .github/workflows/phase-2i-c-stage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTRACT.md REGRESSION_CHECKLIST.md index.html route-plan-days.js route-plan-controls.js tests/phase-2i-c-day-management.test.js docs/PHASE_2I_C_DAY_MANAGEMENT_CHANGE_RECORD_2026-09-08.md
          git add -u .github/workflows/phase-2i-c-stage.yml
          git diff --cached --check
          git commit -m "Phase 2I-C: add multi-day day management"
          git push origin HEAD:feat/phase-2i-c-stage-runner-final

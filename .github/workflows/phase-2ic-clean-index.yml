name: Build clean Phase 2I-C index blob

on:
  push:
    branches:
      - feat/phase-2i-c-clean-publication
    paths:
      - .github/workflows/phase-2ic-clean-index.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-2i-c-clean-publication
      - name: Build verified minimal index
        run: bash .tmp-phase-2ic-clean-index.sh
      - name: Commit verified clean index
        run: |
          set -euo pipefail
          rm .github/workflows/phase-2ic-clean-index.yml .tmp-phase-2ic-clean-index.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -u .github/workflows/phase-2ic-clean-index.yml .tmp-phase-2ic-clean-index.sh
          git commit -m "Stage clean Phase 2I-C index blob"
          git push origin HEAD:feat/phase-2i-c-clean-publication

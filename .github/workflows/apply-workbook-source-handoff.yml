name: Apply Workbook Source Handoff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/workbook-source-handoff' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/workbook-source-handoff
          fetch-depth: 0

      - name: Apply exact governed patch
        run: python3 tools/apply_workbook_source_handoff.py

      - name: Run complete verification
        shell: bash
        run: |
          set -euo pipefail
          npm test
          for file in *.js; do
            node --check "$file"
          done

      - name: Remove temporary patch machinery
        run: |
          rm tools/apply_workbook_source_handoff.py
          rm .github/workflows/apply-workbook-source-handoff.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contract.js app.js garmin-gpx.js index.html CONTRACT.md tests/workbook-source-handoff.test.js docs/workbook-source-handoff-change-record.md tools/apply_workbook_source_handoff.py .github/workflows/apply-workbook-source-handoff.yml
          git commit -m "Preserve workbook route source separately"
          git push origin HEAD:feature/workbook-source-handoff

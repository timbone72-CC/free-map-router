steps:
  - id: verify-contract-and-app
    name: node:22
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        npm test
        for file in *.js; do
          node --check "$$file"
        done

  - id: build-commit-image
    name: gcr.io/k8s-skaffold/pack
    entrypoint: pack
    args:
      - build
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fmr-route-optimizer:$COMMIT_SHA
      - --builder
      - gcr.io/buildpacks/builder:latest
      - --network
      - cloudbuild
      - --publish
      - --env
      - GOOGLE_NODEJS_VERSION=22.x.x

  - id: deploy-and-verify
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail

        service="fmr-route-optimizer"
        region="us-central1"
        runtime_account="fmr-route-runtime@$PROJECT_ID.iam.gserviceaccount.com"
        image="us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fmr-route-optimizer:$COMMIT_SHA"

        test -n "$COMMIT_SHA"

        latest_main="$$(
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/timbone72-CC/free-map-router/commits/main' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["sha"])'
        )"

        if [ "$$latest_main" != "$COMMIT_SHA" ]; then
          echo "Skipping stale commit $COMMIT_SHA; GitHub main is $$latest_main."
          exit 0
        fi

        actual_runtime_account="$$(
          gcloud run services describe "$$service" \
            --project="$PROJECT_ID" \
            --region="$$region" \
            --format='value(spec.template.spec.serviceAccountName)'
        )"

        if [ "$$actual_runtime_account" != "$$runtime_account" ]; then
          echo "STOP: The Cloud Run runtime service account does not match the protected configuration."
          exit 1
        fi

        previous_revision="$$(
          gcloud run services describe "$$service" \
            --project="$PROJECT_ID" \
            --region="$$region" \
            --format='value(status.latestReadyRevisionName)'
        )"
        deployed_revision=""
        rollback_needed=0

        rollback() {
          exit_code=$$?
          if [ "$$rollback_needed" -eq 1 ]; then
            current_revision="$$(
              gcloud run services describe "$$service" \
                --project="$PROJECT_ID" \
                --region="$$region" \
                --format='value(status.latestReadyRevisionName)' \
                || true
            )"
            if [ "$$current_revision" = "$$deployed_revision" ]; then
              echo "Health verification failed; returning traffic to $$previous_revision."
              gcloud run services update-traffic "$$service" \
                --project="$PROJECT_ID" \
                --region="$$region" \
                --to-revisions="$$previous_revision=100" \
                --quiet \
                || true
            else
              echo "A newer revision is ready; rollback will not overwrite it."
            fi
          fi
          exit "$$exit_code"
        }
        trap rollback ERR

        gcloud run deploy "$$service" \
          --project="$PROJECT_ID" \
          --region="$$region" \
          --image="$$image" \
          --quiet

        deployed_revision="$$(
          gcloud run services describe "$$service" \
            --project="$PROJECT_ID" \
            --region="$$region" \
            --format='value(status.latestReadyRevisionName)'
        )"
        rollback_needed=1

        service_url="$$(
          gcloud run services describe "$$service" \
            --project="$PROJECT_ID" \
            --region="$$region" \
            --format='value(status.url)'
        )"

        curl -fsS \
          --retry 5 \
          --retry-all-errors \
          --retry-delay 3 \
          "$$service_url/health" \
          | tee /tmp/fmr-health.json
        grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' /tmp/fmr-health.json

        rollback_needed=0
        trap - ERR
        echo
        echo "Deployed commit $COMMIT_SHA as revision $$deployed_revision."

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
